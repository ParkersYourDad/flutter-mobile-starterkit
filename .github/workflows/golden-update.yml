name: One-time Golden Refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-goldens:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Refresh the two visual baselines
        shell: bash
        run: |
          rm -rf test/goldens/goldens
          flutter test --update-goldens test/goldens/shared_components_golden_test.dart
      - name: Commit refreshed baselines
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A test/goldens
          if git diff --cached --quiet; then
            echo "Golden baselines are already current."
            exit 0
          fi
          git commit -m "test: refresh light and dark golden baselines [skip ci]"
          git push origin HEAD:main
