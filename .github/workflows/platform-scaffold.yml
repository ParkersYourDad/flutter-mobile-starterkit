name: Native Platform Scaffolding

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    name: Generate missing Android and iOS projects
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check whether native projects are missing
        id: check
        shell: bash
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ] && [ -f ios/Runner/Info.plist ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Flutter stable
        if: steps.check.outputs.needed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native project templates
        if: steps.check.outputs.needed == 'true'
        run: flutter create --empty --platforms=android,ios --project-name flutter_mobile_starterkit "$RUNNER_TEMP/native_scaffold"

      - name: Copy platform directories into repository
        if: steps.check.outputs.needed == 'true'
        shell: bash
        run: |
          cp -R "$RUNNER_TEMP/native_scaffold/android" ./android
          cp -R "$RUNNER_TEMP/native_scaffold/ios" ./ios
          test -f android/app/src/main/AndroidManifest.xml
          test -f ios/Runner/Info.plist

      - name: Commit platform scaffolding
        if: steps.check.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios
          if git diff --cached --quiet; then
            echo "No native platform changes to commit."
            exit 0
          fi
          git commit -m "chore: add Android and iOS platform scaffolding"
          git push origin HEAD:main
