name: Vendor Licensed Font Assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  vendor-fonts:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pinned IBM Plex Sans Arabic assets
        shell: bash
        run: |
          set -euo pipefail
          source_commit="71f558992315a12ca1f06a2215d57962a1992162"
          destination="assets/fonts/ibm_plex_sans_arabic"
          mkdir -p "$destination"
          base="https://raw.githubusercontent.com/IBM/plex/$source_commit/packages/plex-sans-arabic"
          curl --fail --silent --show-error --location "$base/fonts/complete/ttf/IBMPlexSansArabic-Regular.ttf" --output "$destination/IBMPlexSansArabic-Regular.ttf"
          curl --fail --silent --show-error --location "$base/fonts/complete/ttf/IBMPlexSansArabic-SemiBold.ttf" --output "$destination/IBMPlexSansArabic-SemiBold.ttf"
          curl --fail --silent --show-error --location "$base/LICENSE.txt" --output "$destination/OFL.txt"
          test "$(wc -c < "$destination/IBMPlexSansArabic-Regular.ttf")" -gt 200000
          test "$(wc -c < "$destination/IBMPlexSansArabic-SemiBold.ttf")" -gt 200000
          grep -q "SIL OPEN FONT LICENSE Version 1.1" "$destination/OFL.txt"
          sha256sum "$destination"/*
      - name: Commit font assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/ibm_plex_sans_arabic
          if git diff --cached --quiet; then
            echo "Font assets are already present."
            exit 0
          fi
          git commit -m "chore: vendor IBM Plex Sans Arabic under OFL-1.1 [skip ci]"
          git push origin HEAD:main
